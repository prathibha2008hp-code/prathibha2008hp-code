<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Prathibha — GitHub Profile Preview</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050816;
      color: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 18px;
      background:
        radial-gradient(ellipse at 15% 0%, rgb(91 33 182 / 22%), transparent 38rem),
        radial-gradient(ellipse at 90% 15%, rgb(8 145 178 / 15%), transparent 35rem),
        #050816;
    }
    main {
      max-width: 1012px;
      margin: 0 auto;
      padding: clamp(20px, 5vw, 52px);
      overflow: hidden;
      border: 1px solid rgb(148 163 184 / 16%);
      border-radius: 22px;
      background: rgb(8 11 24 / 94%);
      box-shadow: 0 28px 100px rgb(0 0 0 / 45%), 0 0 60px rgb(124 58 237 / 10%);
    }
    .markdown-body { line-height: 1.65; overflow-wrap: anywhere; }
    .markdown-body > :first-child { margin-top: 0; }
    h1, h2, h3 { color: #f8fafc; line-height: 1.25; }
    h2 {
      margin-top: 2.2em;
      padding-bottom: .45em;
      border-bottom: 1px solid rgb(148 163 184 / 20%);
    }
    a { color: #67e8f9; text-decoration: none; }
    a:hover { text-decoration: underline; }
    img { max-width: 100%; height: auto; }
    p, li { color: #cbd5e1; }
    blockquote {
      margin: 1.2em 0;
      padding: .2em 1em;
      border-left: 3px solid #8b5cf6;
      background: rgb(124 58 237 / 8%);
      color: #ddd6fe;
    }
    blockquote p { color: #ddd6fe; }
    table { display: block; width: 100%; overflow-x: auto; border-collapse: collapse; }
    th, td { min-width: 170px; padding: 12px 14px; border: 1px solid rgb(148 163 184 / 20%); text-align: left; }
    th { background: rgb(124 58 237 / 12%); color: #e9d5ff; }
    hr { height: 1px; border: 0; background: linear-gradient(90deg, transparent, #8b5cf6, #22d3ee, transparent); }
    .status { max-width: 1012px; margin: 0 auto 14px; color: #94a3b8; font-size: .85rem; }
    .error { color: #fda4af; }
    @media (max-width: 600px) {
      body { padding: 12px 8px; }
      main { padding: 18px 14px; border-radius: 14px; }
      th, td { min-width: 135px; padding: 9px; }
    }
  </style>
</head>
<body>
  <p class="status" id="status">Loading README.md…</p>
  <main><article class="markdown-body" id="readme"></article></main>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script>
    const status = document.getElementById("status");
    fetch("README.md")
      .then((response) => {
        if (!response.ok) throw new Error(`README.md could not be loaded (${response.status})`);
        return response.text();
      })
      .then((markdown) => {
        document.getElementById("readme").innerHTML = marked.parse(markdown, { gfm: true, breaks: false });
        status.textContent = "Local preview · README.md";
      })
      .catch((error) => {
        status.textContent = `${error.message}. Start the preview from the repository root using the instructions in PREVIEW.md.`;
        status.classList.add("error");
      });
  </script>
</body>
</html>
